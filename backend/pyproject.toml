[project]
name = "rebuttal"
version = "0.1.0"
description = "Dispute-prevention agent for small PayPal merchants (PayPal AI Hackathon)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "openai>=1.50",
    "fpdf2>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# An application, not a library: run from backend/ with `uv run`, nothing to build or install.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

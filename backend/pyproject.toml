[project]
name = "rebuttal"
version = "0.1.0"
description = "Dispute-prevention agent for small PayPal merchants (PayPal AI Hackathon)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fpdf2>=2.8",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langchain-core>=1.6.7",
    "langchain-anthropic>=1.7.5",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "langfuse>=4.17.0",
    "langchain>=1.4.3",
]

[project.optional-dependencies]
postgres = [
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv]
# An application, not a library: run from backend/ with `uv run`, nothing to build or install.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus import order, bugbear-lite upgrades and simplifications.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["rebuttal"]
branch = true

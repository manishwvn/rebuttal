# The free Render web service sleeps after 15 idle minutes, and the first request after that takes about a minute.
# A sleeping service can also miss a PayPal webhook delivery on the first try. Pinging the health endpoint every
# 10 minutes keeps it awake for free: Actions minutes are free on a public repo, and one free service running 24/7
# (about 744 hours a month) fits Render's 750 free instance hours. This replaces the paid Render plan in PLAN.md.
# GitHub may delay scheduled runs at busy times; a late ping only means an occasional cold start.
#
# Uses the APP_HEALTH_URL repo variable (Settings > Secrets and variables > Actions), like keep-supabase-awake.yml.
name: keep-render-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the app health endpoint
        env:
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
        run: |
          if [ -z "$APP_HEALTH_URL" ]; then
            echo "Set the APP_HEALTH_URL repo variable."; exit 1
          fi
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 "$APP_HEALTH_URL"

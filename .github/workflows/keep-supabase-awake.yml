# Free Supabase projects are paused after about 7 days of low activity (docs: "Project Pausing"). This pings the
# database once a day so the project stays awake through judging (Dec 15, 2026).
#
# One of these two, set in the repo's Settings > Secrets and variables > Actions:
#   variable APP_HEALTH_URL   https://<deployed app>/api/health   (the endpoint runs SELECT 1 on the database)
#   secret   SUPABASE_DB_URL   the same postgresql:// URL as DATABASE_URL (session pooler, port 5432)
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 6 * * *"   # daily
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app health endpoint
        if: ${{ vars.APP_HEALTH_URL != '' }}
        env:
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
        run: curl --fail --silent --show-error --max-time 60 --retry 3 "$APP_HEALTH_URL"
      - name: Query the database directly
        if: ${{ vars.APP_HEALTH_URL == '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Set the APP_HEALTH_URL variable or the SUPABASE_DB_URL secret."; exit 1
          fi
          psql "$SUPABASE_DB_URL" --no-psqlrc -tAc "select 1"

# Free security gates: secret scan, CodeQL, OSV dependency scan. All free for a public repo; none needs a secret.
name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"   # weekly, so new advisories surface without a push
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not only the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  osv-scanner:
    # The reusable workflow is only published under exact release tags (no moving major tag).
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      scan-args: |-
        --lockfile=backend/uv.lock
        --lockfile=frontend/package-lock.json

# Runs the whole backend test suite on every push and pull request. Needs no secrets: tests run on the in-memory
# mock sandbox with the rules provider (tests/conftest.py pins REBUTTAL_MOCK=1, REBUTTAL_REASONER=rules, no tracing,
# no online database).
name: tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (locked)
        run: uv sync --frozen --extra postgres
      - name: Tests
        run: uv run --frozen pytest -q
